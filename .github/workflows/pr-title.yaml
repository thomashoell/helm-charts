name: PR title

# PRs are squash-merged and the PR title becomes the commit message on main,
# which semantic-release uses to decide whether and how a chart is released.
# Required status check: "pr-title / Conventional Commit".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: dreitier/shared-ci-components/.github/workflows/conventional-pr-title.yml@58a8cb9e21175302f10c5254d74e55c9af22485e  # v1.4.0
