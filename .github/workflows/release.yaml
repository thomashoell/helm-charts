---
name: Release Charts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

# never run two releases at the same time, both would push to main
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write   # OCI copies of the charts on GHCR
    runs-on: ubuntu-latest
    steps:
      # One release per chart with multi-semantic-release (dreitier/shared-ci-components): npm workspaces
      # charts/* (package.json per chart, version stays 0.0.0 - the tags are the truth), only commits touching
      # the chart directory count. Config: .releaserc.json (prepareCmd bumps Chart.yaml/appVersion, CHANGELOG.md,
      # release commit; no GitHub release - chart-releaser creates it below) and .multi-releaserc.json (tags keep
      # the chart-releaser format <chart>-<version>). Runs as the release app, which may bypass the main ruleset.
      - name: Version charts
        id: version
        # v1.4.0 is the first release with @semantic-release/exec (prepareCmd in .releaserc.json)
        uses: dreitier/shared-ci-components/multi-semantic-release@58a8cb9e21175302f10c5254d74e55c9af22485e  # v1.4.0
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # cr index pushes to gh-pages with the app token (persisted by the checkout below)
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # the action's checkout doesn't persist credentials; main now includes the release commits
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Add repositories
        run: |
          for dir in $(ls -d charts/*/); do
            helm dependency list $dir 2> /dev/null | tail +2 | head -n -1 | awk '{ print "helm repo add " $1 " " $3 }' | while read cmd; do $cmd; done
          done

      # Package every chart whose current version has no GitHub release yet. Independent of
      # chart-releaser's "changed since last tag" detection, which doesn't work with the tags
      # semantic-release has just created.
      - name: Package unreleased chart versions
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .cr-release-packages && mkdir -p .cr-release-packages
          for chart in charts/*/; do
            name=$(basename "$chart")
            version=$(awk '/^version:/ { print $2 }' "$chart/Chart.yaml")
            if gh release view "${name}-${version}" > /dev/null 2>&1; then
              echo "${name}-${version}: already released"
              continue
            fi
            echo "${name}-${version}: packaging"
            helm dependency build "$chart"
            helm package "$chart" --destination .cr-release-packages
          done
          if compgen -G ".cr-release-packages/*.tgz" > /dev/null; then
            echo "packaged=true" >> "$GITHUB_OUTPUT"
          fi

      # The action is only used to install cr: with skip_packaging, v1.7.0 fails at the end
      # ("latest_tag: unbound variable", fixed on main but not released yet)
      - name: Install chart-releaser
        if: steps.package.outputs.packaged == 'true'
        uses: helm/chart-releaser-action@v1.9.0
        with:
          install_only: true

      - name: Run chart-releaser
        if: steps.package.outputs.packaged == 'true'
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          cr upload --owner "$owner" --git-repo "$repo" --commit "$(git rev-parse HEAD)" --skip-existing
          rm -rf .cr-index && mkdir -p .cr-index
          cr index --owner "$owner" --git-repo "$repo" --push

      # Same packages as OCI artifacts on GHCR (oci://ghcr.io/<owner>/charts/<chart>): consumers (tg-env)
      # pull from the registry instead of GitHub release downloads (chart-releaser's index points there).
      - name: Push charts to GHCR
        if: steps.package.outputs.packaged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          for pkg in .cr-release-packages/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done
